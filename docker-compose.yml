# WafControl + Nginx/ModSecurity v3 + CRS, PostgreSQL and Redis.
#   cp docker/.env.example .env   # set passwords, admin user, ALLOWED_HOSTS
#   docker compose up -d --build
# Panel: http://<host>:7000/   Protected sites: ports 80/443 (server blocks added from the panel).
# Apache + ModSecurity2 instead: docker compose -f docker-compose.apache.yml up -d --build

services:
  wafcontrol:
    build:
      context: .
      args:
        SERVER: nginx
        REPO_URL: ${REPO_URL:-https://github.com/aedkymish/wafcontrol.git}
        REPO_BRANCH: ${REPO_BRANCH:-main}
    image: wafcontrol:nginx
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "${PANEL_PORT:-7000}:7000"
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - nginx-conf:/etc/nginx          # conf.d, ModSecurity, CRS versions, IP lists
      - waf-logs:/var/log              # access/error logs and /var/log/modsec_audit.log
      - wafcontrol-data:/var/lib/wafcontrol   # SECRET_KEY, generated migrations, beat schedule

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wafcontrol}
      POSTGRES_USER: ${DB_USER:-wafcontrol}
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  nginx-conf:
  waf-logs:
  wafcontrol-data:
  db-data:
  redis-data:
